<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0A0D12">
  <meta name="robots" content="noindex">
  <title>Sayfa bulunamadı — Karevo</title>
  <link rel="icon" href="/public/brand/karevo-app-icon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: Geist; font-weight: 100 900; font-display: swap; src: url("/fonts/geist-5.3.0-latin-wght.woff2") format("woff2"); }
    @font-face { font-family: Geist; font-weight: 100 900; font-display: swap; src: url("/fonts/geist-5.3.0-latin-ext-wght.woff2") format("woff2"); unicode-range: U+0100-02BA; }
    :root { --bg: #0A0D12; --text: #F2F5F8; --muted: #9AA7B4; --grad: linear-gradient(105deg, #C4B5FD 0%, #8B5CF6 100%); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: var(--bg) radial-gradient(ellipse 60% 40% at 50% 30%, rgba(139, 92, 246, 0.16), transparent 70%); color: var(--text); font-family: Geist, ui-sans-serif, system-ui, sans-serif; text-align: center; }
    .code { margin: 0; font-size: clamp(5rem, 18vw, 10rem); font-weight: 600; letter-spacing: -0.06em; line-height: 1; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { margin: 12px 0 0; font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: 600; letter-spacing: -0.04em; }
    p { margin: 12px 0 0; color: var(--muted); }
    a { display: inline-flex; margin-top: 28px; padding: 14px 22px; border-radius: 999px; background: var(--grad); color: #061018; font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: 2px solid #A78BFA; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Bu sahne kurgudan çıkarılmış.</h1>
    <p>Aradığınız sayfa yok ya da taşındı.</p>
    <a href="/">Ana sayfaya dön</a>
  </main>
</body>
</html>
